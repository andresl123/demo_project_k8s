apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: app
          image: {{ .Values.image }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /api/hello, port: http }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /api/hello, port: http }
            initialDelaySeconds: 20
