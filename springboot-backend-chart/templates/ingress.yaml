apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect-port: "8443"
spec:
  ingressClassName: nginx
  rules:
  - host: asl.serveblog.net
    http:
      paths:
      - backend:
          service:
            name: {{ .Release.Name }}
            port:
              number: 8080
        path: /api/hello
        pathType: Prefix
  tls:
  - hosts:
    - asl.serveblog.net
    secretName: resume-tls